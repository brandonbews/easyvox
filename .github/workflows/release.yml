name: Release

# Publishing a GitHub Release for a new v* tag starts this. The maintainer does it on the
# Releases page, as a pre-release, and publishing creates the tag. The `release` job builds
# EasyVox, signs it with the Developer ID, and notarizes and staples the app and the DMG
# (scripts/release.sh). The `publish` job then attaches the DMG to that release, sets its notes
# and makes it the latest release. docs/releasing.md describes how a release is built.
#
# A draft starts nothing: its tag doesn't exist until it's published.
#
# The `release` job runs in the `release` environment, which holds the signing secrets and waits
# for a required reviewer to approve each run. Until those secrets exist, a run fails at the
# first signing step.
#
# Environment secrets:
#   MACOS_CERTIFICATE_P12_BASE64   the Developer ID Application certificate and key, a base64 .p12
#   MACOS_CERTIFICATE_PASSWORD     the .p12's password
#   NOTARY_API_KEY_P8_BASE64       an App Store Connect team API key, the base64 .p8
#   NOTARY_API_KEY_ID              its key ID
#   NOTARY_API_ISSUER_ID           its issuer ID
on:
  release:
    types: [published]

permissions:
  contents: read

# One release at a time, and never cancelled halfway through a notarization.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

# Actions are pinned to commit SHAs (tags can be moved); the comment names the release.

jobs:
  release:
    name: Sign and notarize
    # A release for any other tag isn't one of the app's.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26
    # A clean build, plus two notarizations that may each wait up to 2 hours: a new team's first
    # submissions can stay "In Progress" that long.
    timeout-minutes: 300
    environment: release
    # Read-only, though it holds the signing key: the `publish` job writes the release.
    permissions:
      contents: read # actions/checkout
    outputs:
      version: ${{ steps.release.outputs.version }}
      dmg: ${{ steps.release.outputs.dmg }}
    defaults:
      run:
        shell: bash
    # No rust-cache. A release run can restore only main's caches, which CI's `check` job saves
    # under its own key, for the dev and test profiles this `dist` build doesn't use. Restoring
    # them into the job that holds the signing key would open a way in for no gain.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust (version and components from rust-toolchain.toml)
        run: rustup set profile minimal && rustup toolchain install --no-self-update

      # release.sh runs dmgbuild through uvx.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          enable-cache: false

      - name: Tool versions
        run: |
          rustc -Vv
          cmake --version
          xcodebuild -version
          xcrun notarytool --version
          uv --version

      # A wrong tag, an unbumped version or a missing CHANGELOG.md section fails here, in seconds,
      # rather than after the build.
      - name: Check the tag, the version and the changelog
        run: scripts/release.sh --tag "$GITHUB_REF_NAME" --check

      # dmgbuild, with the same pins as release.sh, fetched before any secret is on the runner.
      # The release step runs uv offline (UV_OFFLINE), so a pin that drifts from release.sh's
      # fails there instead of fetching.
      - name: Fetch dmgbuild
        run: uvx --python 3.12 --with ds_store==1.3.3 --with mac_alias==2.2.3 dmgbuild==1.6.7 --help >/dev/null

      # The build runs before the secrets are on the runner, which keeps them out of its
      # environment. It doesn't isolate the build: a build script could leave a process running,
      # or write to $GITHUB_PATH or $GITHUB_ENV to change the later steps. Reviewing the diff
      # (Cargo.lock, build.rs, scripts/, .github/) before approving the run is what guards the
      # key. release.sh builds again and finds nothing to compile.
      - name: Build
        run: scripts/bundle.sh

      # GitHub's recipe for a temporary keychain ("Installing an Apple certificate on macOS
      # runners for Xcode development"), with access limited to codesign. The keychain lives
      # only for this job, so its password is made here rather than stored as a secret.
      - name: Import the certificate into a temporary keychain
        id: keychain
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain=$RUNNER_TEMP/easyvox-signing.keychain-db
          p12=$RUNNER_TEMP/certificate.p12
          keychain_password=$(openssl rand -hex 24)
          echo "::add-mask::$keychain_password"

          (umask 077 && printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode -o "$p12")
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -k "$keychain" -f pkcs12 -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"

          # The identity's SHA-1, so no name or Team ID has to be configured. The runner image
          # has Apple's Developer ID G2 intermediate, which a valid identity needs.
          identity=$(security find-identity -v -p codesigning "$keychain" | awk '/"Developer ID Application: / {print $2}')
          if [[ ! $identity =~ ^[0-9A-F]{40}$ ]]; then
            security find-identity -p codesigning "$keychain"
            echo "::error::expected exactly one valid Developer ID Application identity in the certificate"
            exit 1
          fi
          echo "keychain=$keychain" >>"$GITHUB_OUTPUT"
          echo "identity=$identity" >>"$GITHUB_OUTPUT"

      - name: Write the App Store Connect API key
        env:
          NOTARY_API_KEY_P8_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
        run: |
          umask 077
          printf '%s' "$NOTARY_API_KEY_P8_BASE64" | base64 --decode -o "$RUNNER_TEMP/notary-api-key.p8"

      - name: Build, sign, notarize and package
        id: release
        env:
          IDENTITY: ${{ steps.keychain.outputs.identity }}
          KEYCHAIN: ${{ steps.keychain.outputs.keychain }}
          NOTARY_API_KEY_PATH: ${{ runner.temp }}/notary-api-key.p8
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          UV_OFFLINE: "1"
        run: |
          scripts/release.sh --identity "$IDENTITY" --keychain "$KEYCHAIN" --tag "$GITHUB_REF_NAME" --notarize
          cat dist/release.env >>"$GITHUB_OUTPUT"

      # Whatever happened above.
      - name: Delete the keychain and the key files
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/easyvox-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/notary-api-key.p8"

      # For the `publish` job.
      - name: Keep the DMG and the release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            ${{ steps.release.outputs.dmg }}
            ${{ steps.release.outputs.notes }}
          if-no-files-found: error

      # The notary service's verdict and issues for the app and the DMG, accepted or not.
      - name: Keep the notary logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notary-logs
          path: dist/notary/
          if-no-files-found: ignore
          retention-days: 90

  # Kept apart from the job with the signing key, so that job never holds a token that can write
  # to the repository, and this one never sees the key.
  publish:
    name: Publish the GitHub Release
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # gh release upload and edit
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release

      # The release already exists: publishing it started this run. gh refuses to upload over a
      # file of the same name, so a DMG that's out is never replaced.
      - name: Attach the DMG and make it the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
          DMG: ${{ needs.release.outputs.dmg }}
        run: |
          gh release upload "$GITHUB_REF_NAME" "release/${DMG##*/}" --repo "$GITHUB_REPOSITORY"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "EasyVox $VERSION" --notes-file release/release-notes.md \
            --prerelease=false --latest
