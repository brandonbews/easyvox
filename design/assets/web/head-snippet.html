<!-- EasyVox: favicons, theme colour and link previews. -->
<!-- Replace https://easyvox.github.io with the site's real origin (og:url and og:image must be absolute). -->

<title>EasyVox — dictation that stays on your Mac</title>
<meta name="description" content="Hold ⌥Space, talk, let go. Free, open-source dictation that runs entirely on your Mac.">

<!-- Icons. The .ico (16, 32, 48) is the fallback; sizes="32x32" stops Chrome preferring it over the SVG. -->
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1C1E" media="(prefers-color-scheme: dark)">

<!-- Link previews (OpenGraph). og-image.png is the dark card; og-image-light.png is the alternative. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="EasyVox">
<meta property="og:title" content="EasyVox — dictation that stays on your Mac">
<meta property="og:description" content="Hold ⌥Space, talk, let go. Free, open-source dictation that runs entirely on your Mac.">
<meta property="og:url" content="https://easyvox.github.io/">
<meta property="og:image" content="https://easyvox.github.io/og-image.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="The EasyVox mark above the line: Hold ⌥Space, talk, let go.">
<meta name="twitter:card" content="summary_large_image">
