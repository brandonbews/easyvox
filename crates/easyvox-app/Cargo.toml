[package]
name = "easyvox-app"
description = "EasyVox for macOS: a GPUI Kit menu bar app around easyvox-core."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
default-run = "easyvox"

[[bin]]
name = "easyvox"
path = "src/main.rs"

[features]
# `--self-test`: launch for real, check the native state and a full replay session, write
# JSON, quit. For checking the app on a machine nobody is looking at.
self-test = ["dep:serde_json", "dep:sha2"]

[dependencies]
# Only the transcribe.cpp runtime and the mic. The sherpa-onnx fallback adds 18.5 MB.
easyvox-core = { workspace = true, features = ["transcribe-cpp", "mic"] }
gpui-kit.workspace = true
anyhow.workspace = true
log.workspace = true
serde_json = { workspace = true, optional = true }
# The self-test's download check hashes its payload. Same version core uses.
sha2 = { version = "0.11", optional = true }
async-channel = "2"
# Menu bar icon and global shortcuts: Tauri-team crates, used without Tauri.
tray-icon = { version = "0.26.1", default-features = false }
global-hotkey = "0.8.0"
# The settings file. Both come with GPUI Kit already: toml_edit (as a build-time dependency)
# keeps the user's comments and layout when Settings writes a key, and notify (FSEvents on
# macOS) watches the file without a polling timer.
toml_edit = "0.25.17"
notify = "8.2.0"

[target.'cfg(target_os = "macos")'.dependencies]
# Default features, like the spike: GPUI already enables nearly all of objc2-app-kit anyway.
objc2.workspace = true
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
# The overlay's open and close run on Core Animation. Already in the build through GPUI and
# objc2-app-kit; these are the parts the overlay uses.
objc2-quartz-core = { version = "0.3", default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "CAAnimation",
  "CALayer",
  "CAMediaTiming",
  "CAMediaTimingFunction",
  "CATransaction",
  "CATransform3D",
] }
raw-window-handle = "0.6"

[lints]
workspace = true
